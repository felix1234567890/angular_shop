name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build -- --configuration production

    - name: Unit Tests
      run: npm test -- --watch=false --browsers=ChromeHeadless

    - name: E2E Tests
      run: |
        server_log="$RUNNER_TEMP/angular-shop-server.log"
        npm start -- --host 127.0.0.1 > "$server_log" 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT

        for attempt in {1..60}; do
          if curl --fail --silent http://127.0.0.1:4200/angular_shop/ > /dev/null; then
            npm run cypress:run -- --browser chrome
            exit 0
          fi
          if ! kill -0 "$server_pid" 2>/dev/null; then
            cat "$server_log"
            exit 1
          fi
          sleep 2
        done

        cat "$server_log"
        echo "Angular server did not become ready within 120 seconds."
        exit 1

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist/re-shop/browser
